# =============================================================================
# FisherP – Staging Docker Compose
# Near-production environment: PostgreSQL + Redis + Gunicorn + Nginx
# (No PgBouncer, single web replica, less resources than production)
#
# Usage:
#   cp fish-trading-saas/.env.docker.example .env   # fill in staging values
#   docker compose -f docker-compose.staging.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fisherp_staging}
      POSTGRES_USER: ${DB_USER:-fisherp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./fish-trading-saas/scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fisherp_user} -d ${DB_NAME:-fisherp_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - staging_net

  # ---------------------------------------------------------------------------
  # Redis – cache + Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - staging_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_net

  # ---------------------------------------------------------------------------
  # Django / Gunicorn – single worker replica
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./fish-trading-saas
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_staging
      APP_ROLE: web
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-staging.fisherp.com,localhost}
      DB_NAME: ${DB_NAME:-fisherp_staging}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-600}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_static:/app/staticfiles
      - staging_media:/app/media
      - staging_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - staging_net

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: ./fish-trading-saas
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_staging
      APP_ROLE: celery
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-fisherp_staging}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - web
      - redis
    volumes:
      - staging_logs:/app/logs
    command: celery -A trading.celery:app worker --loglevel=info --concurrency=2
    networks:
      - staging_net

  # ---------------------------------------------------------------------------
  # Celery Beat
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./fish-trading-saas
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_staging
      APP_ROLE: celery-beat
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-fisherp_staging}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - web
      - redis
    volumes:
      - staging_logs:/app/logs
    command: celery -A trading.celery:app beat --loglevel=info
    networks:
      - staging_net

  # ---------------------------------------------------------------------------
  # Nginx – reverse proxy (HTTP only for staging; HTTPS via external LB)
  # Uses a staging-specific config that omits SSL enforcement.
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./fish-trading-saas/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - staging_static:/var/www/static:ro
      - staging_media:/var/www/media:ro
      - ./fish-trading-saas/nginx/nginx-staging.conf:/etc/nginx/nginx.conf:ro
    networks:
      - staging_net

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_static:
  staging_media:
  staging_logs:

networks:
  staging_net:
    driver: bridge
