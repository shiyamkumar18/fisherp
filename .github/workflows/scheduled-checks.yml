name: Scheduled Security & Dependency Checks

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        run: |
          echo "=== Auditing requirements.txt ==="
          pip-audit -r requirements.txt --format=json --output=audit-prod.json 2>&1 || true
          pip-audit -r requirements.txt || true

      - name: Audit dev dependencies
        run: |
          echo "=== Auditing requirements-dev.txt ==="
          pip-audit -r requirements-dev.txt --format=json --output=audit-dev.json 2>&1 || true
          pip-audit -r requirements-dev.txt || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-dependency-audit-${{ github.run_id }}
          path: |
            fish-trading-saas/backend/audit-prod.json
            fish-trading-saas/backend/audit-dev.json

  bandit-nightly:
    name: Nightly Bandit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit (all severity levels)
        run: |
          bandit -r . \
            --exclude ./migrations,./venv,./.venv \
            -f json \
            -o bandit-nightly.json \
            2>&1 || true
          bandit -r . \
            --exclude ./migrations,./venv,./.venv \
            || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-bandit-report-${{ github.run_id }}
          path: fish-trading-saas/backend/bandit-nightly.json

  outdated-packages:
    name: Check Outdated Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: List outdated packages
        run: |
          echo "=== Outdated packages ==="
          pip list --outdated --format=columns || true

  django-check:
    name: Nightly Django System Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fish-trading-saas/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs

      - name: Run Django system check
        env:
          SECRET_KEY: nightly-check-key-not-for-production
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --fail-level WARNING 2>&1 || true
