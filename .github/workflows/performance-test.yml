name: Performance Testing

on:
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  performance-test:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fisherp_perf
          POSTGRES_USER: fisherp_user
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fish-trading-saas/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install locust

      - name: Create required directories
        run: mkdir -p logs

      - name: Set up environment
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-perf-test-only-not-for-production
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=fisherp_perf
          DB_USER=fisherp_user
          DB_PASSWORD=postgres_test_password
          DB_HOST=localhost
          DB_PORT=5432
          EOF

      - name: Run database migrations
        run: python manage.py migrate --run-syncdb

      - name: Start Django server for performance tests
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5
          curl -f http://localhost:8000/health/ || exit 1

      - name: Run performance benchmarks (slow-marked tests)
        run: |
          set +e
          python -m pytest \
            -m "slow" \
            --tb=short \
            -v \
            2>&1
          exit_code=$?
          set -e

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$exit_code" -ne 0 ]; then
              echo "::warning::Slow-marked performance tests failed on scheduled run (non-blocking)."
            fi
          else
            exit "$exit_code"
          fi

      - name: API response time check
        run: |
          echo "Checking API response times..."
          declare -A thresholds=(
            ["/health/"]="500"
            ["/health/ready/"]="500"
            ["/api/schema/"]="2000"
          )

          FAILED=0
          for endpoint in "${!thresholds[@]}"; do
            TIME_MS=$(curl -o /dev/null -s -w "%{time_total}" \
              "http://localhost:8000${endpoint}" | \
              awk '{printf "%d", $1 * 1000}')
            THRESHOLD="${thresholds[$endpoint]}"
            if [ "$TIME_MS" -gt "$THRESHOLD" ]; then
              echo "❌ SLOW: ${endpoint} took ${TIME_MS}ms (threshold: ${THRESHOLD}ms)"
              FAILED=1
            else
              echo "✅ OK: ${endpoint} took ${TIME_MS}ms (threshold: ${THRESHOLD}ms)"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Some endpoints exceeded performance thresholds."
            exit 1
          fi

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-logs
          path: |
            fish-trading-saas/backend/logs
          retention-days: 14
