name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        continue-on-error: true
        run: |
          bandit -r . \
            --exclude ./migrations,./venv,./.venv,./.git,./tests \
            --skip B101,B601 \
            -f json \
            -o /tmp/bandit-report.json \
            2>&1 || true
          bandit -r . \
            --exclude ./migrations,./venv,./.venv,./.git,./tests \
            --skip B101,B601 \
            -ll \
            2>&1

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: /tmp/bandit-report.json
          retention-days: 30

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for vulnerabilities
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output /tmp/pip-audit-report.json \
            2>&1 || true
          pip-audit \
            --requirement requirements.txt \
            2>&1

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: /tmp/pip-audit-report.json
          retention-days: 30

  django-security-check:
    name: Django Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fish-trading-saas/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs

      - name: Set up environment
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-security-check-not-for-production-change-this
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Run Django system security checks
        # These are dummy values required to import settings_prod.py;
        # the check --deploy command does NOT connect to any database.
        env:
          DB_NAME: fisherp_ci
          DB_USER: fisherp_user
          DB_PASSWORD: ci_password
          DB_HOST: localhost
          DB_PORT: "5432"
          CORS_ALLOWED_ORIGINS: https://localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check --deploy \
            --settings=config.settings_prod \
            2>&1

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with TruffleHog
        uses: trufflesecurity/trufflehog@v3.94.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
