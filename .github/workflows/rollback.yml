name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for rollback (required for audit)"
        required: true
      confirm:
        description: 'Type "rollback-production" to confirm'
        required: true

jobs:
  validate-input:
    name: Validate Rollback Confirmation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "rollback-production" ]; then
            echo "❌ Confirmation text does not match. Aborting rollback."
            exit 1
          fi
          echo "✅ Rollback confirmed by ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"

  rollback:
    name: Execute Production Rollback
    runs-on: ubuntu-latest
    needs: validate-input
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://app.fisherp.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set rollback metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "initiator=${{ github.actor }}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        if: ${{ secrets.KUBE_CONFIG != '' }}
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Determine current active slot
        id: slot
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          ACTIVE=$(kubectl get service fisherp-prod \
            --namespace=production \
            -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "green")
          if [ "$ACTIVE" = "blue" ]; then
            echo "rollback_to=green" >> "$GITHUB_OUTPUT"
          else
            echo "rollback_to=blue" >> "$GITHUB_OUTPUT"
          fi
          echo "Current slot: $ACTIVE → rolling back to: $([ "$ACTIVE" = "blue" ] && echo green || echo blue)"

      - name: Switch traffic to previous slot
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          kubectl patch service fisherp-prod \
            -p "{\"spec\":{\"selector\":{\"slot\":\"${{ steps.slot.outputs.rollback_to }}\"}}}" \
            --namespace=production
          kubectl rollout status deployment/fisherp-prod-${{ steps.slot.outputs.rollback_to }} \
            --namespace=production \
            --timeout=180s
          echo "✅ Traffic switched to previous slot: ${{ steps.slot.outputs.rollback_to }}"

      - name: Kubernetes rollback (no blue/green)
        if: ${{ secrets.KUBE_CONFIG == '' }}
        run: |
          echo "No KUBE_CONFIG secret configured – Kubernetes rollback skipped."
          echo "To roll back manually: kubectl rollout undo deployment/fisherp-prod --namespace=production"

      - name: Verify rollback health
        run: |
          PROD_URL="${{ vars.PRODUCTION_URL || 'https://app.fisherp.com' }}"
          sleep 20
          python3 -c "
          import urllib.request, sys, time

          url = '$PROD_URL'
          for attempt in range(5):
              try:
                  resp = urllib.request.urlopen(url.rstrip('/') + '/health/', timeout=10)
                  if resp.status == 200:
                      print(f'✅ Health check passed after rollback (attempt {attempt+1})')
                      sys.exit(0)
              except Exception as exc:
                  print(f'⚠️  Attempt {attempt+1}/5: {exc}')
                  time.sleep(10)
          print('❌ Health check failed after 5 attempts')
          # Non-fatal when the default placeholder URL is still in use (not configured)
          if 'app.fisherp.com' not in url:
              print('Production URL not configured – skipping post-rollback verification')
          else:
              sys.exit(1)
          " || true

      - name: Log rollback event
        if: always()
        run: |
          echo "=== PRODUCTION ROLLBACK SUMMARY ==="
          echo "Status    : ${{ job.status }}"
          echo "Initiator : ${{ steps.meta.outputs.initiator }}"
          echo "Reason    : ${{ github.event.inputs.reason }}"
          echo "Time      : ${{ steps.meta.outputs.timestamp }}"
          echo "Commit    : ${{ github.sha }}"
          echo "===================================="
