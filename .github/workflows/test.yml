name: Test Suite

on:
  push:
    branches: [ main, develop, "copilot/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fisherp_test
          POSTGRES_USER: fisherp_user
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: fish-trading-saas/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create required directories
        run: mkdir -p logs

      - name: Set up environment
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-only-not-for-production-change-this-in-real-env
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=fisherp_test
          DB_USER=fisherp_user
          DB_PASSWORD=postgres_test_password
          DB_HOST=localhost
          DB_PORT=5432
          EOF

      - name: Run database migrations
        run: python manage.py migrate --run-syncdb

      - name: Run unit tests
        run: |
          python -m pytest \
            accounts/tests/ \
            trading/tests/ \
            dashboard/tests/ \
            subscriptions/tests/ \
            companies/tests/ \
            health/ \
            tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -m "not slow" \
            2>&1

      - name: Run integration tests
        run: |
          python -m pytest \
            -m "integration" \
            --tb=short \
            -v \
            2>&1

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: fish-trading-saas/backend/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . \
            --config=.flake8 \
            --statistics
