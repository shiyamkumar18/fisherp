name: Test Suite

on:
  push:
    branches: [ main, develop, "copilot/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fish-trading-saas/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-django pytest-cov

      - name: Create required directories
        run: mkdir -p logs

      - name: Set up environment
        run: |
          cp .env.example .env 2>/dev/null || echo "SECRET_KEY=ci-test-only-not-for-production
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1" > .env

      - name: Run database migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py migrate --run-syncdb

      - name: Run unit tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -m pytest \
            accounts/tests/ \
            trading/tests/ \
            dashboard/tests/ \
            subscriptions/tests/ \
            companies/tests/ \
            health/ \
            tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-omit="*/migrations/*,*/settings*,manage.py,*/admin.py,conftest.py" \
            -v \
            --tb=short \
            -m "not slow" \
            2>&1

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: fish-trading-saas/backend/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fish-trading-saas/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . \
            --count \
            --max-line-length=120 \
            --exclude=migrations,*.egg-info,.git,__pycache__ \
            --ignore=E501,W503,E302,E303,W291,W293,E501 \
            --statistics \
            --max-complexity=15
