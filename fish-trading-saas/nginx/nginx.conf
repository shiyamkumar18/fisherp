# =============================================================================
# FisherP – Production Nginx Configuration
# Reverse proxy for the Django / Gunicorn backend
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # -------------------------------------------------------------------------
    # Upstream: Django / Gunicorn
    # -------------------------------------------------------------------------
    upstream django {
        server web:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Docker / load-balancer health probes (no TLS required)
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            access_log off;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS – main application
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (mounted as a volume in production)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Include shared SSL/TLS hardening
        include /etc/nginx/conf.d/ssl.conf;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # HSTS – 1 year, include subdomains, preload
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # -------------------------------------------------------------------------
        # Static files (served directly by Nginx – very fast)
        # -------------------------------------------------------------------------
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -------------------------------------------------------------------------
        # Media files
        # -------------------------------------------------------------------------
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # -------------------------------------------------------------------------
        # Health check (no rate limiting)
        # -------------------------------------------------------------------------
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # -------------------------------------------------------------------------
        # Login endpoint – strict rate limiting
        # -------------------------------------------------------------------------
        location /api/auth/login/ {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # -------------------------------------------------------------------------
        # API – standard rate limiting
        # -------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # -------------------------------------------------------------------------
        # Django admin
        # -------------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # -------------------------------------------------------------------------
        # Default – proxy to Django
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
