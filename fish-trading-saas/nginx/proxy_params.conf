# =============================================================================
# FisherP – Nginx Proxy Parameters
# Shared proxy header settings included in every location block that
# forwards requests to the Django / Gunicorn upstream.
# =============================================================================

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 60s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_http_version 1.1;
proxy_set_header Connection "";    # Enable HTTP keep-alive to the upstream
