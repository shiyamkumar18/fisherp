# =============================================================================
# FisherP – Nginx SSL/TLS Hardening Configuration
# Included by nginx.conf inside the HTTPS server block
# =============================================================================

# ---------------------------------------------------------------------------
# Protocols & Ciphers
# ---------------------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;

# Modern cipher suite – only strong algorithms
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';

ssl_prefer_server_ciphers off;   # Let the client choose from the allowed list

# ---------------------------------------------------------------------------
# Session resumption (performance & forward secrecy)
# ---------------------------------------------------------------------------
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;         # Disable session tickets for forward secrecy

# ---------------------------------------------------------------------------
# OCSP Stapling (speeds up TLS handshake for the client)
# ---------------------------------------------------------------------------
ssl_stapling        on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# Diffie-Hellman parameters (pre-generate: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 4096)
# ---------------------------------------------------------------------------
# Uncomment once dhparam.pem has been generated:
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;
