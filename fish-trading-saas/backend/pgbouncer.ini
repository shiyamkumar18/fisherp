; pgbouncer.ini
; ---------------------------------------------------------------------------
; PgBouncer configuration for FisherP production.
;
; Connection pool setup:
;   min_pool_size  : 5  connections always ready
;   max_pool_size  : 20 connections maximum
;   pool_mode      : transaction (most efficient for Django/Gunicorn)
;
; To start:
;   pgbouncer /path/to/pgbouncer.ini
;
; Environment variables referenced here must be expanded by your deployment
; tooling (e.g., Docker, Ansible, Kubernetes secrets).
; ---------------------------------------------------------------------------

[databases]
; Format: <pgbouncer-dbname> = host=<pg-host> port=<pg-port> dbname=<pg-dbname>
fisherp_prod = host=localhost port=5432 dbname=fisherp_prod

[pgbouncer]
; ------- Networking -------
listen_addr = 0.0.0.0
listen_port = 6432

; ------- Authentication -------
; userlist.txt maps usernames → hashed passwords.
; Generate with:  echo '"<user>" "<md5hash>"' >> userlist.txt
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ------- Pool Mode -------
; transaction: server connection returned to pool after each transaction.
; Optimal for stateless web applications.  Requires CONN_MAX_AGE=0 in Django.
pool_mode = transaction

; ------- Pool Sizes -------
; Default pool size per (user, database) pair.
default_pool_size = 20

; Keep at least this many idle server connections.
min_pool_size = 5

; Extra connections allowed when pool is full (temporary burst capacity).
reserve_pool_size = 5

; How long (seconds) to wait for a server connection before returning error.
reserve_pool_timeout = 3

; Maximum total client connections across all pools.
max_client_conn = 200

; ------- Timeouts -------
; Close server connections that have been idle longer than this (seconds).
server_idle_timeout = 600

; Maximum lifetime of a server connection (seconds). Forces periodic reconnect.
server_lifetime = 3600

; Close client connections that have been idle (no query) for this long (s).
; 0 = disabled.
client_idle_timeout = 0

; How long to wait for a connection from the pool (seconds).
query_timeout = 30

; ------- Logging -------
; 0 = log only errors; 1 = log connections; 2 = verbose
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Write log to file (useful for systemd/non-Docker deployments).
; logfile = /var/log/pgbouncer/pgbouncer.log

; ------- Admin -------
; Comma-separated list of users allowed to run pgbouncer admin commands.
; (SHOW POOLS, SHOW STATS, RELOAD, etc.)
admin_users = fisherp_user

; Users allowed to connect and run read-only SHOW commands.
stats_users = fisherp_user

; ------- TLS (uncomment for production with SSL-terminated PG) -------
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_ca_file = /etc/pgbouncer/ca.crt

; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
