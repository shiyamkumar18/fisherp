<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisherP - Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/additional.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.min.js"></script>
    <script src="js/utils.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/hooks/useRole.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/forms.js" defer></script>
    <script src="js/pages/management.js" defer></script>
    <script src="js/pages/analytics.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body class="app-shell tenant-shell">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <button class="sidebar-toggle" id="menuToggle">Menu</button>
        <main class="main-content" id="main-content">Loading...</main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- Modal Element for Forms -->
    <div id="modalOverlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" type="button" onclick="UI.closeModal()" aria-label="Close modal">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-header" id="modalTitle">Details</h2>
            <div id="modalBody"></div>
            <div id="modalFooter" class="hero-actions"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize UI components first
            if (window.UI && window.UI.init) {
                window.UI.init();
            }
            // Then initialize app shell
            App.init();
        });
    </script>
</body>
</html>
