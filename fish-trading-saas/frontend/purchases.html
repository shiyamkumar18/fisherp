<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisherP - Purchases</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Purchases Management</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span id="userName">Loading...</span>
                        <span id="userRole" class="role-badge"></span>
                    </div>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Purchase Orders</h3>
                        <div class="header-actions">
                            <input type="text" id="purchaseSearch" placeholder="Search purchases..." class="form-control search-input">
                            <button class="btn btn-primary" onclick="Trading.showAddPurchaseModal()">Add Purchase</button>
                        </div>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Fish Type</th>
                                <th>Amount</th>
                                <th>Packages</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="purchaseTable">
                            <tr><td colspan="7" class="text-center">Loading purchases...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/trading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.App.loadPage('purchases');
        });
    </script>
</body>
</html>
