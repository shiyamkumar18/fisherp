<!-- Purchases Page - Spec 7 -->
<div class="page-header">
    <h1 class="page-title">Purchases</h1>
    <button class="btn-primary" onclick="showAddPurchaseModal()">+ Add Purchase</button>
</div>

<!-- Form - Top Section -->
<div class="form-section">
    <h2>Add New Purchase</h2>
    <div class="form-grid">
        <div class="form-group">
            <label class="form-label">Fish</label>
            <select id="purchase-fish" class="form-select">
                <option>Salmon</option>
                <option>Tilapia</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Supplier</label>
            <select id="purchase-supplier" class="form-select">
                <option>Fisherman Raj</option>
                <option>Aqua Farms</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Quantity (packages)</label>
            <input type="number" id="purchase-quantity" class="form-input" oninput="calculatePurchaseTotal()">
        </div>
        <div class="form-group">
            <label class="form-label">Price/kg</label>
            <input type="number" id="purchase-price" class="form-input" step="0.01" oninput="calculatePurchaseTotal()">
        </div>
        <div class="form-group">
            <label class="form-label">Total</label>
            <input type="number" id="purchase-total" class="form-input" readonly>
        </div>
    </div>
    <button class="btn-save" onclick="savePurchase()">Save Purchase</button>
</div>

<!-- Purchase History Table - Below Form -->
<div class="table-container">
    <div class="table-header">Purchase History</div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Batch</th>
                <th>Fish</th>
                <th>Supplier</th>
                <th>Packages</th>
                <th>Cost</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="purchaseTable">
            <tr>
                <td>BATCH-045</td>
                <td>Salmon</td>
                <td>Fisherman Raj</td>
                <td>100</td>
                <td>$1,750</td>
                <td class="status-good">Paid</td>
                <td>2024-03-23</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editPurchase(45)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePurchase(45)">Delete</button>
                </td>
            </tr>
            <tr>
                <td>BATCH-046</td>
                <td>Tilapia</td>
                <td>Aqua Farms</td>
                <td>80</td>
                <td>$640</td>
                <td class="status-medium">Partial</td>
                <td>2024-03-23</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editPurchase(46)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePurchase(46)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function calculatePurchaseTotal() {
    const quantity = parseFloat(document.getElementById('purchase-quantity').value) || 0;
    const price = parseFloat(document.getElementById('purchase-price').value) || 0;
    document.getElementById('purchase-total').value = (quantity * price).toFixed(2);
}

function showAddPurchaseModal() {
    // Form already visible per spec
}

function savePurchase() {
    const data = {
        fish: document.getElementById('purchase-fish').value,
        supplier: document.getElementById('purchase-supplier').value,
        quantity: document.getElementById('purchase-quantity').value,
        price: document.getElementById('purchase-price').value,
        total: document.getElementById('purchase-total').value
    };
    console.log('Save purchase:', data);
    loadPage('purchases');
}

function editPurchase(id) {
    showModal('Edit Purchase', '<p>Edit purchase form</p>');
}

function deletePurchase(id) {
    if (confirm('Delete this purchase?')) {
        console.log('Delete purchase', id);
        loadPage('purchases');
    }
}
</script>
