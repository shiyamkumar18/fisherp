<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisherP - Subscriptions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"><!-- Dynamic sidebar --></aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="pageTitle">Subscriptions</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span id="userName">Loading...</span>
                        <span id="userRole" class="role-badge"></span>
                    </div>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Current Subscription</h3>
                        <div class="subscription-status" id="subscriptionStatus">
                            <span class="status-badge loading">Loading...</span>
                        </div>
                    </div>
                    <div class="subscription-details">
                        <div class="grid-3" id="currentSubDetails">
                            <!-- Dynamic content -->
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3>Available Plans</h3>
                        <button class="btn btn-primary" onclick="Management.upgradePlan()">Upgrade Plan</button>
                    </div>
                    <table class="data-table" id="plansTable">
                        <thead>
                            <tr>
                                <th>Plan</th>
                                <th>Price</th>
                                <th>Users</th>
                                <th>Features</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="6" class="text-center">Loading plans...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/components/Sidebar.js"></script>
    <script src="js/components/MobileNav.js"></script>
    <script src="js/components/QuickActions.js"></script>
    <script src="js/pages/management.js"></script>
    <script>
        // Page-specific initialization
        document.addEventListener('DOMContentLoaded', function() {
            if (window.App) window.App.loadPage('subscription');
        });
    </script>
</body>
</html>
