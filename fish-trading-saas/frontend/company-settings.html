<div class="page-header">
    <div>
        <h1 class="page-title">Shop Settings</h1>
        <p class="page-subtitle">Manage your business identity, GST, and branding</p>
    </div>
</div>

<div class="form-section">
    <div class="section-caption">Business Information</div>
    <h2>Configure your shop</h2>
    <form id="companyForm">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="shopName">Shop Name</label>
                <input class="form-input" type="text" id="shopName" placeholder="Your shop name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="ownerName">Owner Name</label>
                <input class="form-input" type="text" id="ownerName" placeholder="Your full name">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-input" type="tel" id="phone" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" type="email" id="email" placeholder="shop@example.com">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="address">Address</label>
                <textarea class="form-input" id="address" placeholder="Shop address" rows="3"></textarea>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="gst">GST Number (Optional)</label>
                <input class="form-input" type="text" id="gst" placeholder="e.g., 27AABCR5055K1Z5">
            </div>
            <div class="form-group">
                <label class="form-label" for="city">City</label>
                <input class="form-input" type="text" id="city" placeholder="City name">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="pincode">Pincode</label>
                <input class="form-input" type="text" id="pincode" placeholder="Postal code">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="logo">Shop Logo</label>
            <input class="form-input" type="file" id="logo" accept="image/*">
            <small>Used for bill printing and reports (PNG/JPG, max 2MB)</small>
        </div>

        <div class="hero-actions">
            <button class="btn btn-primary" type="submit">Save Settings</button>
        </div>
    </form>
</div>

<script>
// Load company settings
async function loadCompanySettings() {
    const company = await apiCall('/companies/details/', 'GET');
    if (company) {
        document.getElementById('shopName').value = company.name || '';
        document.getElementById('ownerName').value = company.owner_name || '';
        document.getElementById('phone').value = company.phone || '';
        document.getElementById('email').value = company.email || '';
        document.getElementById('address').value = company.address || '';
        document.getElementById('city').value = company.city || '';
        document.getElementById('gst').value = company.gst || '';
        document.getElementById('pincode').value = company.pincode || '';
    }
}

// Save company settings
document.getElementById('companyForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData();
    formData.append('name', document.getElementById('shopName').value);
    formData.append('owner_name', document.getElementById('ownerName').value);
    formData.append('phone', document.getElementById('phone').value);
    formData.append('email', document.getElementById('email').value);
    formData.append('address', document.getElementById('address').value);
    formData.append('city', document.getElementById('city').value);
    formData.append('gst', document.getElementById('gst').value);
    formData.append('pincode', document.getElementById('pincode').value);

    const logoFile = document.getElementById('logo').files[0];
    if (logoFile) {
        formData.append('logo', logoFile);
    }

    const token = localStorage.getItem('token') || '';
    try {
        const response = await fetch(`${window.location.origin}/api/companies/details/`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: formData
        });

        if (response.ok) {
            showAlert('Shop settings saved successfully', 'success');
        } else {
            showAlert('Failed to save settings', 'danger');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Error saving settings', 'danger');
    }
});

loadCompanySettings();
</script>
