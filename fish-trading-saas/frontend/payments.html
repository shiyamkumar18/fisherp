<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisherP - Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth-modern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"><!-- Dynamic sidebar --></aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Payments Management</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span id="userName">Loading...</span>
                        <span id="userRole" class="role-badge"></span>
                    </div>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>All Payments</h3>
                        <div class="header-actions">
                            <input type="text" id="paymentSearch" placeholder="Search payments..." class="form-control search-input">
                            <button class="btn btn-primary" onclick="Trading.showAddPaymentModal()">Add Payment</button>
                            <button class="btn btn-secondary" onclick="Trading.exportPayments()">Export</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Mode</th>
                                    <th>Reference</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="paymentTable">
                                <tr><td colspan="7" class="text-center">Loading payments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Payment Modal -->
    <div id="addPaymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Payment</h3>
                <span class="modal-close" onclick="Trading.closePaymentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addPaymentForm">
                    <div class="form-group">
                        <label>Payment Type</label>
                        <select name="payment_type" required>
                            <option value="">Select type</option>
                            <option value="purchase">Purchase Payment</option>
                            <option value="sale">Sale Payment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" name="amount" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>Payment Mode</label>
                        <select name="payment_mode" required>
                            <option value="">Select mode</option>
                            <option value="cash">Cash</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="cheque">Cheque</option>
                            <option value="upi">UPI</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Reference</label>
                        <input type="text" name="reference_number">
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea name="notes"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Purchase Batch (optional)</label>
                        <select name="purchase_batch">
                            <option value="">No batch</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sale (optional)</label>
                        <select name="sale">
                            <option value="">No sale</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Trading.closePaymentModal()">Cancel</button>
                <button class="btn btn-primary" onclick="Trading.savePayment()">Save Payment</button>
            </div>
        </div>
    </div>

    <!-- Edit Payment Modal -->
    <div id="editPaymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Payment</h3>
                <span class="modal-close" onclick="Trading.closeEditPaymentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editPaymentForm">
                    <input type="hidden" name="id">
                    <!-- Similar fields as add form -->
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Trading.closeEditPaymentModal()">Cancel</button>
                <button class="btn btn-primary" onclick="Trading.updatePayment()">Update Payment</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/trading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.App.loadPage('payments');
        });
    </script>
</body>
</html>
