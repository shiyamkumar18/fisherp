<!-- Buyers Page - Spec 9 -->
<div class="page-header">
    <h1 class="page-title">Buyers</h1>
    <button class="btn-primary" onclick="showAddBuyerModal()">+ Add Buyer</button>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Total Orders</th>
                <th>Outstanding</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="buyerTable">
            <tr>
                <td>ABC Retail</td>
                <td>+1-234-567-8900</td>
                <td>123 Main St</td>
                <td>15</td>
                <td>$2,300</td>
                <td class="status-good">Active</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editBuyer(1)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteBuyer(1)">Delete</button>
                </td>
            </tr>
            <tr>
                <td>XYZ Mart</td>
                <td>+1-234-567-8901</td>
                <td>456 Oak Ave</td>
                <td>8</td>
                <td>$1,200</td>
                <td class="status-good">Active</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editBuyer(2)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteBuyer(2)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function showAddBuyerModal() {
    showModal('Add New Buyer', `
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" id="buyer-name" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" id="buyer-phone" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Address</label>
            <textarea id="buyer-address" class="form-input" rows="3"></textarea>
        </div>
    `, () => {
        const data = {
            name: document.getElementById('buyer-name').value,
            phone: document.getElementById('buyer-phone').value,
            address: document.getElementById('buyer-address').value
        };
        console.log('Save buyer:', data);
        loadPage('buyers');
    });
}

function editBuyer(id) {
    showModal('Edit Buyer', '<p>Edit buyer form</p>');
}

function deleteBuyer(id) {
    if (confirm('Delete this buyer?')) {
        console.log('Delete buyer', id);
        loadPage('buyers');
    }
}
</script>
