<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisherP - Buyers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"><!-- Dynamic sidebar --></aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="pageTitle">Buyers</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span id="userName">Loading...</span>
                        <span id="userRole" class="role-badge"></span>
                    </div>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Buyers Management</h3>
                        <div class="header-actions">
                            <input type="text" id="buyerSearch" placeholder="Search buyers..." class="form-control search-input">
                            <button class="btn btn-primary" onclick="Trading.showAddBuyerModal()">Add New Buyer</button>
                        </div>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Type</th>
                                <th>Credit Limit</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="buyerTable">
                            <tr><td colspan="7" class="text-center">Loading buyers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Buyer Modal -->
    <div id="buyerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="buyerModalTitle">Add New Buyer</h3>
                <span class="modal-close" onclick="Trading.closeBuyerModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="buyerForm">
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" name="phone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Buyer Type *</label>
                        <select name="buyer_type" required>
                            <option value="retail">Retail</option>
                            <option value="wholesale">Wholesale</option>
                            <option value="export">Export</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Credit Limit</label>
                        <input type="number" name="credit_limit" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Is Active</label>
                        <input type="checkbox" name="is_active" checked>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Trading.closeBuyerModal()">Cancel</button>
                <button class="btn btn-primary" onclick="Trading.saveBuyer()">Save Buyer</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/trading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.App.loadPage('buyers');
        });
    </script>
</body>
</html>
