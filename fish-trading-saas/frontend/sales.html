<!-- Sales Page - Spec 8 -->
<div class="page-header">
    <h1 class="page-title">Sales</h1>
    <button class="btn-primary" onclick="showAddSaleModal()">+ Add Sale</button>
</div>

<!-- Form - Top Section -->
<div class="form-section">
    <h2>Add New Sale</h2>
    <div class="form-grid">
        <div class="form-group">
            <label class="form-label">Buyer</label>
            <select id="sale-buyer" class="form-select">
                <option>ABC Retail</option>
                <option>XYZ Mart</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Fish</label>
            <select id="sale-fish" class="form-select">
                <option>Salmon</option>
                <option>Tilapia</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Quantity (packages)</label>
            <input type="number" id="sale-quantity" class="form-input" oninput="calculateSaleTotal()">
        </div>
        <div class="form-group">
            <label class="form-label">Price/kg</label>
            <input type="number" id="sale-price" class="form-input" step="0.01" oninput="calculateSaleTotal()">
        </div>
        <div class="form-group">
            <label class="form-label">Total</label>
            <input type="number" id="sale-total" class="form-input" readonly>
        </div>
    </div>
    <button class="btn-save" onclick="saveSale()">Save Sale</button>
</div>

<!-- Sales History Table - Below Form -->
<div class="table-container">
    <div class="table-header">Sales History</div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Invoice</th>
                <th>Buyer</th>
                <th>Fish</th>
                <th>Packages</th>
                <th>Revenue</th>
                <th>Profit</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="saleTable">
            <tr>
                <td>SALE-001</td>
                <td>ABC Retail</td>
                <td>Salmon</td>
                <td>50</td>
                <td>$2,500</td>
                <td>$750</td>
                <td class="status-good">Paid</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editSale(1)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSale(1)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function calculateSaleTotal() {
    const quantity = parseFloat(document.getElementById('sale-quantity').value) || 0;
    const price = parseFloat(document.getElementById('sale-price').value) || 0;
    document.getElementById('sale-total').value = (quantity * price).toFixed(2);
}

function showAddSaleModal() {
    // Form already visible on page per spec
}

function saveSale() {
    const data = {
        buyer: document.getElementById('sale-buyer').value,
        fish: document.getElementById('sale-fish').value,
        quantity: document.getElementById('sale-quantity').value,
        price: document.getElementById('sale-price').value,
        total: document.getElementById('sale-total').value
    };
    // API call
    console.log('Save sale:', data);
    loadPage('sales');
}

function editSale(id) {
    showModal('Edit Sale', '<p>Edit form would go here</p>');
}

function deleteSale(id) {
    if (confirm('Delete this sale?')) {
        console.log('Delete sale', id);
        loadPage('sales');
    }
}
</script>
