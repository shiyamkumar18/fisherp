<div class="page-header">
    <div>
        <h1 class="page-title">Customer Management</h1>
        <p class="page-subtitle">Manage customers, credit limits, and payment history</p>
    </div>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center;">
    <button class="btn btn-primary" onclick="showAddCustomerModal()"><i class="fas fa-plus"></i> Add Customer</button>
    <div style="flex: 1;">
        <input type="text" class="form-input" id="customerSearch" placeholder="Search customers..." 
               style="margin: 0;" onkeyup="filterCustomerTable()">
    </div>
</div>

<div class="data-grid">
    <table class="data-table">
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Total Orders</th>
                <th>Credit Balance</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="customersTableBody">
            <tr>
                <td colspan="6" style="text-align: center; padding: 2rem; color: #999;">
                    <i class="fas fa-spinner fa-spin"></i> Loading customers...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Add/Edit Customer Modal -->
<div id="customerModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; overflow-y: auto;">
    <div style="background: white; border-radius: 8px; padding: 2rem; width: 90%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 2rem auto;">
        <h2>Add New Customer</h2>
        <form id="customerForm">
            <div class="form-group">
                <label class="form-label" for="customerName">Customer Name</label>
                <input class="form-input" type="text" id="customerName" placeholder="e.g., Mohan Traders" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="customerPhone">Phone</label>
                <input class="form-input" type="tel" id="customerPhone" placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label class="form-label" for="customerEmail">Email</label>
                <input class="form-input" type="email" id="customerEmail" placeholder="customer@example.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="customerAddress">Address</label>
                <textarea class="form-input" id="customerAddress" placeholder="Customer address" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="creditLimit">Credit Limit (₹)</label>
                <input class="form-input" type="number" id="creditLimit" placeholder="0.00" step="0.01" value="0">
            </div>

            <div class="form-group">
                <label class="form-label" for="customerStatus">Status</label>
                <select class="form-input" id="customerStatus">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn btn-ghost" type="button" onclick="closeCustomerModal()">Cancel</button>
                <button class="btn btn-primary" type="submit">Save Customer</button>
            </div>
        </form>
    </div>
</div>

<!-- Customer Details Modal -->
<div id="customerDetailsModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; overflow-y: auto;">
    <div style="background: white; border-radius: 8px; padding: 2rem; width: 90%; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 2rem auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 id="detailsTitle">Customer Details</h2>
            <button type="button" onclick="closeCustomerDetailsModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>

        <div id="customerDetailsContent">
            <i class="fas fa-spinner fa-spin"></i> Loading...
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <button class="btn btn-ghost" type="button" onclick="closeCustomerDetailsModal()">Close</button>
        </div>
    </div>
</div>

<script>
let allCustomers = [];
let editingCustomerId = null;

async function loadCustomers() {
    const customers = await apiCall('/trading/buyers/', 'GET');
    if (customers) {
        allCustomers = Array.isArray(customers) ? customers : (customers.results || []);
        renderCustomersTable();
    }
}

function renderCustomersTable() {
    const tbody = document.getElementById('customersTableBody');
    if (!allCustomers.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: #999;">No customers found. Add one to get started.</td></tr>';
        return;
    }

    tbody.innerHTML = allCustomers.map(customer => `
        <tr>
            <td><strong>${sanitize(customer.name)}</strong></td>
            <td>${sanitize(customer.phone || '-')}</td>
            <td>${sanitize(customer.email || '-')}</td>
            <td>${customer.total_orders || 0}</td>
            <td style="${Number(customer.credit_balance || 0) > 0 ? 'color: #d32f2f; font-weight: bold;' : ''}">
                ₹${Number(customer.credit_balance || 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}
            </td>
            <td>
                <div class="row-actions">
                    <button class="btn btn-secondary btn-sm" onclick="viewCustomerDetails(${customer.id})">View</button>
                    <button class="btn btn-primary btn-sm" onclick="editCustomer(${customer.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${customer.id})">Delete</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function filterCustomerTable() {
    const searchTerm = document.getElementById('customerSearch').value.toLowerCase();
    const filtered = allCustomers.filter(c => 
        c.name.toLowerCase().includes(searchTerm) || 
        (c.phone && c.phone.includes(searchTerm)) ||
        (c.email && c.email.toLowerCase().includes(searchTerm))
    );
    
    const tbody = document.getElementById('customersTableBody');
    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: #999;">No customers match your search.</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(customer => `
        <tr>
            <td><strong>${sanitize(customer.name)}</strong></td>
            <td>${sanitize(customer.phone || '-')}</td>
            <td>${sanitize(customer.email || '-')}</td>
            <td>${customer.total_orders || 0}</td>
            <td style="${Number(customer.credit_balance || 0) > 0 ? 'color: #d32f2f; font-weight: bold;' : ''}">
                ₹${Number(customer.credit_balance || 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}
            </td>
            <td>
                <div class="row-actions">
                    <button class="btn btn-secondary btn-sm" onclick="viewCustomerDetails(${customer.id})">View</button>
                    <button class="btn btn-primary btn-sm" onclick="editCustomer(${customer.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${customer.id})">Delete</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function showAddCustomerModal() {
    editingCustomerId = null;
    document.getElementById('customerForm').reset();
    document.querySelector('#customerModal h2').textContent = 'Add New Customer';
    document.getElementById('customerModal').style.display = 'flex';
}

function closeCustomerModal() {
    document.getElementById('customerModal').style.display = 'none';
    editingCustomerId = null;
}

async function editCustomer(customerId) {
    const customer = allCustomers.find(c => c.id === customerId);
    if (!customer) return;

    editingCustomerId = customerId;
    document.getElementById('customerName').value = customer.name;
    document.getElementById('customerPhone').value = customer.phone || '';
    document.getElementById('customerEmail').value = customer.email || '';
    document.getElementById('customerAddress').value = customer.address || '';
    document.getElementById('creditLimit').value = customer.credit_limit || 0;
    document.getElementById('customerStatus').value = customer.status || 'active';
    document.querySelector('#customerModal h2').textContent = 'Edit Customer';
    document.getElementById('customerModal').style.display = 'flex';
}

async function viewCustomerDetails(customerId) {
    const customer = allCustomers.find(c => c.id === customerId);
    if (!customer) return;

    const contentDiv = document.getElementById('customerDetailsContent');
    contentDiv.innerHTML = `
        <div style="margin-bottom: 1.5rem;">
            <h3>${sanitize(customer.name)}</h3>
            <div style="display: grid; gap: 1rem; grid-template-columns: 1fr 1fr;">
                <div>
                    <strong>Phone:</strong> ${sanitize(customer.phone || '-')}
                </div>
                <div>
                    <strong>Email:</strong> ${sanitize(customer.email || '-')}
                </div>
                <div>
                    <strong>Address:</strong> ${sanitize(customer.address || '-')}
                </div>
                <div>
                    <strong>Credit Limit:</strong> ₹${Number(customer.credit_limit || 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                </div>
                <div>
                    <strong>Credit Balance:</strong> <span style="${Number(customer.credit_balance || 0) > 0 ? 'color: #d32f2f; font-weight: bold;' : ''}">₹${Number(customer.credit_balance || 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                </div>
                <div>
                    <strong>Total Orders:</strong> ${customer.total_orders || 0}
                </div>
            </div>
        </div>
        <div>
            <strong>Recent Orders:</strong>
            <div id="recentOrders" style="margin-top: 1rem;">
                <i class="fas fa-spinner fa-spin"></i> Loading orders...
            </div>
        </div>
    `;

    document.getElementById('detailsTitle').textContent = customer.name;
    document.getElementById('customerDetailsModal').style.display = 'flex';

    // Load recent orders
    const orders = await apiCall(`/trading/buyers/${customerId}/orders/`, 'GET');
    if (orders && orders.length) {
        const ordersHtml = orders.slice(0, 5).map(order => `
            <div style="padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem;">
                <div><strong>${new Date(order.date).toLocaleDateString('en-IN')}</strong> - ₹${Number(order.amount || 0).toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
                <small style="color: #666;">${order.status}</small>
            </div>
        `).join('');
        document.getElementById('recentOrders').innerHTML = ordersHtml;
    } else {
        document.getElementById('recentOrders').innerHTML = '<p style="color: #999;">No orders yet</p>';
    }
}

function closeCustomerDetailsModal() {
    document.getElementById('customerDetailsModal').style.display = 'none';
}

async function deleteCustomer(customerId) {
    if (!confirm('Are you sure you want to delete this customer?')) return;

    const result = await apiCall(`/trading/buyers/${customerId}/`, 'DELETE');
    if (result !== null) {
        showAlert('Customer deleted successfully', 'success');
        loadCustomers();
    } else {
        showAlert('Failed to delete customer', 'danger');
    }
}

document.getElementById('customerForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
        name: document.getElementById('customerName').value,
        phone: document.getElementById('customerPhone').value,
        email: document.getElementById('customerEmail').value,
        address: document.getElementById('customerAddress').value,
        credit_limit: parseFloat(document.getElementById('creditLimit').value),
        status: document.getElementById('customerStatus').value
    };

    let result;
    if (editingCustomerId) {
        result = await apiCall(`/trading/buyers/${editingCustomerId}/`, 'PUT', data);
    } else {
        result = await apiCall('/trading/buyers/', 'POST', data);
    }

    if (result) {
        showAlert(editingCustomerId ? 'Customer updated successfully' : 'Customer created successfully', 'success');
        closeCustomerModal();
        loadCustomers();
    } else {
        showAlert('Failed to save customer', 'danger');
    }
});

// Close modals on outside click
document.getElementById('customerModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'customerModal') closeCustomerModal();
});

document.getElementById('customerDetailsModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'customerDetailsModal') closeCustomerDetailsModal();
});

loadCustomers();
</script>
