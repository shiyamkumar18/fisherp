# =============================================================================
# FisherP – PostgreSQL + Redis + Django Compose
# Near-production stack with PostgreSQL and Redis, but without Nginx/SSL.
# Suitable for staging or production on private networks.
#
# Usage:
#   cp fish-trading-saas/.env.docker.example .env   # fill in values
#   docker compose -f docker-compose.postgres.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fisherp_prod}
      POSTGRES_USER: ${DB_USER:-fisherp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fish-trading-saas/backend/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./fish-trading-saas/scripts/postgres-init.sh:/docker-entrypoint-initdb.d/02_init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fisherp_user} -d ${DB_NAME:-fisherp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=1000

  # ---------------------------------------------------------------------------
  # Redis – cache + Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django / Gunicorn application server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./fish-trading-saas/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_postgres
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-fisherp_prod}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-600}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ./fish-trading-saas/backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: ./fish-trading-saas/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_postgres
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-fisherp_prod}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - web
      - redis
    volumes:
      - ./fish-trading-saas/backend/logs:/app/logs
    command: celery -A trading.celery:app worker --loglevel=info --concurrency=4

  # ---------------------------------------------------------------------------
  # Celery Beat – periodic task scheduler
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./fish-trading-saas/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_postgres
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-fisherp_prod}
      DB_USER: ${DB_USER:-fisherp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - web
      - redis
    volumes:
      - ./fish-trading-saas/backend/logs:/app/logs
    command: celery -A trading.celery:app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
